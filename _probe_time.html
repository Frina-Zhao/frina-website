<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>probe</title></head>
<body style="font: 14px monospace; padding: 20px;">
<h2>Browser Time Probe</h2>
<pre id="o">loading...</pre>
<script>
  var now = Date.now();
  var d = new Date();
  var utc = d.toISOString();
  var bj = new Date(now + 8*3600*1000).toISOString();
  var lines = [
    'Date.now() epoch ms: ' + now,
    'Date.now() ISO:      ' + utc,
    'Date.now() BJ ISO:   ' + bj,
    'new Date():          ' + d.toString(),
    'performance.now():   ' + performance.now(),
    '---',
    'document.lastModified: ' + document.lastModified,
    'Intl test: ' + new Intl.DateTimeFormat('en', {timeZone: 'Asia/Shanghai', dateStyle: 'full', timeStyle: 'long'}).format(d)
  ];
  document.getElementById('o').textContent = lines.join('\n');
  console.log('PROBE_EPOCH=' + now);
  console.log('PROBE_ISO=' + utc);
  console.log('PROBE_BJ=' + bj);
</script>
</body>
</html>
